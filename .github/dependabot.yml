version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/" # Root - for solution-level dependencies
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # The FsCheck.Xunit 3.x migration is done (#303). Hold *future major*
      # bumps (4.x+) so the next breaking API refactor is taken as a
      # deliberate migration, not auto-proposed. Minor/patch still flow.
      - dependency-name: "FsCheck.Xunit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/benchmarks"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/examples"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
