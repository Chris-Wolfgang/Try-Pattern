name: OSSF Scorecard

# Automated security-posture scoring via https://github.com/ossf/scorecard.
# Checks ~20 best practices (branch protection, pinned actions, signed
# commits, dangerous-workflow patterns, vulnerability response time, …)
# and produces a 0-10 score. Complementary to CodeQL / DevSkim, which
# scan the CODE; Scorecard scans the REPO CONFIGURATION.
#
# Results are:
#   - Uploaded as SARIF to GitHub Code Scanning (Security tab)
#   - Sent to the OpenSSF public scorecard database (only from `main` runs)
#     — this powers the README badge and enables consumers to check the
#     score at https://api.securityscorecards.dev/projects/github.com/Chris-Wolfgang/Try-Pattern.
#
# Score-floor policy: any PR that drops the score below **7.5** must
# explain the regression in the PR body and — after merge — add a line
# to CHANGELOG.md's [Unreleased] Security section documenting the
# accepted lower score. This is a soft gate (reviewer attention), not a
# hard CI-blocking check, because Scorecard's rules are strict enough
# that a single stale dependency can drop the score below floor while
# a fix is in flight.

on:
  # Weekly scan on Monday 06:00 UTC — captures dependency drift + any
  # externally-visible config changes over the past week.
  schedule:
    - cron: '0 6 * * 1'
  # Also run on push to main so a change that affects the score shows up
  # immediately, not up to a week later.
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab for on-demand audits.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF to Code Scanning.
      security-events: write
      # Required to publish results to the OpenSSF public database via
      # keyless signing (OIDC) — this is what makes the score appear
      # in the badge + consumer-checkable API.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF database ONLY on main branch
          # runs (schedule + push to main). PR runs stay local — we
          # don't want in-flight PR scores polluting the badge.
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Filter SARIF (durable suppression of decided-not-fixed findings)
        # Scorecard's per-alert dismissals via `gh api ... -X PATCH
        # /code-scanning/alerts/<n>` do not persist across weekly re-runs
        # because SARIF fingerprints drift each run (session memory:
        # reference_scorecard_dismissal_not_durable). This step strips
        # findings we've explicitly decided not to fix from the SARIF
        # BEFORE upload, so they never enter Code Scanning in the first
        # place. Rationale for each filter is inline below.
        #
        # Preserves the raw unfiltered SARIF in the "scorecard-results"
        # artifact for audit — only the Code Scanning ingest is filtered.
        run: |
          jq '
            .runs[].results |= map(select(
              # DangerousWorkflowID: pr.yaml uses pull_request_target with
              # refs/pull/*/head by intentional design. The untrusted
              # checkout is safely contained by the "Fetch trusted config
              # from main" step, persist-credentials:false, and a
              # top-level contents:read permission. Documented at pr.yaml
              # header. Scorecard flags the pattern; we do not fix.
              (.ruleId != "DangerousWorkflowID")
              and
              # PinnedDependenciesID for pipCommand / nugetCommand /
              # downloadThenRun: these are CLI invocations inside `run:`
              # steps (e.g. `pip install semgrep==...`, `dotnet tool
              # install ...`, `curl ... | bash`). They are already pinned
              # by version at the command line where meaningful, and
              # SHA-pinning is not applicable to arbitrary CLI subcommands.
              # PinnedDependenciesID findings for actual GitHub Actions
              # (which CAN be SHA-pinned) still flow through — those are
              # not filtered out.
              (
                .ruleId != "PinnedDependenciesID"
                or (.message.text | test("pipCommand|nugetCommand|downloadThenRun") | not)
              )
            ))
          ' results.sarif > results-filtered.sarif
          before=$(jq '[.runs[].results[]] | length' results.sarif)
          after=$(jq '[.runs[].results[]] | length' results-filtered.sarif)
          echo "Filtered SARIF: ${before} → ${after} findings ($((before - after)) suppressed)."

      - name: Upload artifact (raw SARIF, for audit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload results to Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          sarif_file: results-filtered.sarif
