name: Cross-platform differential

# Cross-platform × ARM64 differential per issue #177.
#
# pr.yaml already runs the test suite on ubuntu-latest, windows-latest,
# and macos-latest (all x64) — but the outputs are not DIFFED against
# each other. A library can pass on all three while behaving subtly
# differently on one (line-ending handling, culture-sensitive sorts,
# file-system case sensitivity, timing-dependent assertions). ARM64
# (Apple Silicon, AWS Graviton, Windows 11 on Arm) was untested until
# GitHub started providing arm64-hosted runners.
#
# This workflow re-runs the test suite on 6 (os, arch) rows:
#
#   linux-x64      ubuntu-latest
#   linux-arm64    ubuntu-24.04-arm
#   windows-x64    windows-latest
#   windows-arm64  windows-11-arm
#   macos-arm64    macos-latest       (Apple Silicon; latest points to macos-14+)
#
# macos-x64 (macos-13) is intentionally OMITTED. GitHub's Intel-macOS
# hosted-runner capacity is starved — jobs sit queued for 12+ hours on
# public-repo tier — so keeping that row in the matrix effectively
# holds every PR merge-gate open indefinitely. macos-arm64 covers the
# macOS side of the differential; managed-IL is architecture-invariant,
# so the arm/x64 x64/x64 pairing across the other three OSes still
# catches any real cross-OS behaviour drift.
#
# Each row produces a normalized outcome file listing test names +
# pass/fail/skip. A `diff` job compares all 6 files pairwise and fails
# the run if ANY row's outcome set differs from the others. Managed IL
# is arch-independent so the expected diff is empty; a non-empty diff
# is a real correctness signal.

on:
  pull_request:
    branches: [main, vNext]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/cross-platform-differential.yaml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Test on ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: linux-x64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: windows-latest,   label: windows-x64 }
          - { os: windows-11-arm,   label: windows-arm64 }
          - { os: macos-latest,     label: macos-arm64 }
          # macos-x64 removed: see the header comment. GitHub Intel
          # macOS runner capacity is unusable for merge-gating today.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run tests → TRX
        # TRX carries per-test outcome + name in a stable schema — the
        # normalization step doesn't have to parse console output.
        # net10.0 only: managed IL is TFM-invariant on architecture,
        # verifying one modern TFM is enough for the differential.
        shell: bash
        run: |
          dotnet test tests/Wolfgang.TryPattern.Tests.Unit \
            -c Release \
            -f net10.0 \
            --filter "Category!=Fuzz" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./trx

      - name: Normalize TRX → outcome list
        shell: bash
        # PYTHONIOENCODING=utf-8 is required: xUnit truncates long
        # parameter values in the test-name column with U+22EF
        # (MIDLINE HORIZONTAL ELLIPSIS `···`). Python's default stdout
        # encoding on Windows is cp1252, which cannot represent U+22EF
        # and either replaces it with U+FFFD or raises. That produced
        # a false-positive cross-platform diff between the Windows and
        # Linux/macOS outcome files (same tests, different encoded
        # bytes). Forcing UTF-8 emits identical bytes on every runner.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # `xmllint --xpath` returns each UnitTestResult on its own
          # `sort`-able line. Filter to the pieces we care about: the
          # test's fully-qualified name and its outcome (Passed /
          # Failed / NotExecuted). Output is deterministic across
          # OSes because we sort by test name.
          mkdir -p ./outcomes
          trx=$(find ./trx -name '*.trx' | head -n1)
          if [ -z "$trx" ]; then
            echo "::error::No TRX produced."
            exit 1
          fi
          python3 - <<'PY' "$trx" > "./outcomes/${{ matrix.label }}.txt"
          import re, sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          root = tree.getroot()
          ns = {'v': re.match(r'\{(.*)\}', root.tag).group(1)}
          out = []
          for r in root.findall('.//v:UnitTestResult', ns):
              name = r.attrib.get('testName', '?')
              outcome = r.attrib.get('outcome', '?')
              out.append(f'{name}\t{outcome}')
          out.sort()
          print('\n'.join(out))
          PY
          echo "== ${{ matrix.label }} =="
          wc -l ./outcomes/${{ matrix.label }}.txt

      - name: Upload outcome file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outcome-${{ matrix.label }}
          path: ./outcomes/${{ matrix.label }}.txt
          retention-days: 30

  diff:
    name: Diff outcomes across platforms
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all outcome artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: outcomes

      - name: Compare outcomes pairwise
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(outcomes/outcome-*/*.txt)
          if [ ${#files[@]} -lt 2 ]; then
            echo "::warning::Only ${#files[@]} outcome file(s) present — one or more test rows must have failed to upload. Cannot diff."
            exit 0
          fi
          echo "Rows collected: ${#files[@]}"
          for f in "${files[@]}"; do
            echo "  $(basename "$f")"
          done
          # Compare every file to the first as reference. A non-empty
          # diff = the library behaves differently on that OS/arch.
          ref="${files[0]}"
          rc=0
          for f in "${files[@]:1}"; do
            if ! diff -u "$ref" "$f" > "/tmp/diff-$(basename "$f").patch"; then
              echo "::error::$f differs from $ref"
              cat "/tmp/diff-$(basename "$f").patch"
              rc=1
            fi
          done
          if [ "$rc" -eq 0 ]; then
            echo "✅ Every OS/arch produced the same test outcomes."
          else
            echo "::error::Cross-platform differential FAILED — a test outcome varies across OS/arch."
          fi
          exit "$rc"
