# zizmor configuration.
# Docs: https://docs.zizmor.sh/configuration/

rules:
  dangerous-triggers:
    # ACCEPTED for `pr.yaml`. That workflow uses `pull_request_target`
    # deliberately (rather than `pull_request`) so that the workflow
    # YAML itself executes from the base branch (main), not from the
    # PR branch — a malicious PR cannot modify the workflow logic that
    # validates it. The design + mitigations (fetch-trusted-config
    # step, `persist-credentials: false`, minimal permissions, config-
    # files-change guard) are documented in
    # `docs/WORKFLOW_SECURITY.md`.
    #
    # If a future refactor moves the InspectCode / test stages OFF
    # `pull_request_target`, remove this suppression — zizmor's
    # concern is legitimate for any pr.yaml that doesn't have the
    # mitigations we do.
    ignore:
      - pr.yaml
